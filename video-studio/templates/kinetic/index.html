<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>kinetic</title>
<style>
@font-face { font-family: Inter; font-weight: 500; src: url(fonts/inter-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: Inter; font-weight: 700; src: url(fonts/inter-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: Inter; font-weight: 900; src: url(fonts/inter-latin-900-normal.woff2) format("woff2"); }
:root { --bg: #0b1020; --card: #161d36; --line: #2a335a; --text: #f5f7ff; --dim: #8f97b5; --accent: #ffc83d; --ok: #5fe3a1; --no: #ff6b6b; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
body { font-family: Inter, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; background:
  radial-gradient(90rem 70rem at 50% 30%, #1c2750 0%, transparent 70%), var(--bg); }
#grid { position: absolute; inset: 0; opacity: .5; background-image:
  linear-gradient(#ffffff0a 1px, transparent 1px), linear-gradient(90deg, #ffffff0a 1px, transparent 1px);
  background-size: 9rem 9rem; }
#top { position: absolute; left: 7rem; right: 7rem; top: 7rem; display: flex; align-items: center; gap: 3rem; }
#brand { font-weight: 700; font-size: 3rem; letter-spacing: .02em; color: var(--dim); white-space: nowrap; }
#bar { flex: 1; height: .8rem; border-radius: 1rem; background: #ffffff14; overflow: hidden; }
#bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 1rem; }
.scene { position: absolute; left: 8rem; right: 8rem; top: 20rem; bottom: 62rem; display: flex; flex-direction: column;
  justify-content: center; align-items: center; text-align: center; gap: 4.5rem; opacity: 0; }
.h .scene { top: 13rem; bottom: 24rem; left: 14rem; right: 14rem; gap: 3.5rem; }
.kicker { font-weight: 700; font-size: 3.4rem; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
.headline { font-weight: 900; font-size: 10.5rem; line-height: 1.02; letter-spacing: -.03em; text-wrap: balance; }
.h .headline { font-size: 9rem; }
.headline em, .row em { font-style: normal; color: var(--accent); }
.visual { display: flex; flex-wrap: wrap; justify-content: center; gap: 2.4rem; width: 100%; }
.visual.col { flex-direction: column; align-items: stretch; flex-wrap: nowrap; }
.h .visual.col { flex-direction: row; align-items: stretch; }
.h .visual.col > * { flex: 1; }
.chip { position: relative; padding: 2rem 3.6rem; border-radius: 10rem; background: var(--card); border: .3rem solid var(--line);
  font-weight: 700; font-size: 4.4rem; }
.chip s { position: absolute; left: 1.5rem; right: 1.5rem; top: 50%; height: .7rem; margin-top: -.35rem; border-radius: 1rem;
  background: var(--no); transform-origin: left center; transform: scaleX(0); }
.row { display: flex; align-items: center; gap: 3rem; padding: 3rem 3.6rem; border-radius: 3.2rem; background: var(--card);
  border: .3rem solid var(--line); text-align: left; font-weight: 700; font-size: 5rem; }
.h .row { font-size: 4rem; padding: 2.6rem 3rem; }
.badge { flex: none; width: 8rem; height: 8rem; border-radius: 50%; display: grid; place-items: center; font-weight: 900;
  font-size: 4.4rem; background: var(--accent); color: #1a1400; }
.badge.ok { background: var(--ok); color: #04210f; }
.term { width: 100%; border-radius: 3.2rem; background: #070a14; border: .3rem solid var(--line); text-align: left; overflow: hidden; }
.term .dots { display: flex; gap: 1.4rem; padding: 2.6rem 3rem; border-bottom: .3rem solid var(--line); }
.term .dots i { width: 2.2rem; height: 2.2rem; border-radius: 50%; background: #3a4470; }
.term pre { font: 500 4.2rem/1.5 ui-monospace, "DejaVu Sans Mono", monospace; padding: 3.4rem 3.6rem; min-height: 30rem;
  white-space: pre-wrap; color: #cfd6f5; }
.h .term pre { min-height: 22rem; font-size: 3.6rem; }
.term pre b { color: var(--accent); font-weight: 500; }
#cap { position: absolute; left: 6rem; right: 6rem; bottom: 40rem; display: flex; justify-content: center; }
.h #cap { bottom: 8rem; }
#cap div { padding: 2rem 4rem; border-radius: 2.8rem; background: #000000b0; font-weight: 900; font-size: 7rem; letter-spacing: -.01em;
  white-space: nowrap; }
.h #cap div { font-size: 5.6rem; }
#cap span { color: #ffffff66; }
#cap span.said { color: var(--text); }
#cap span.now { color: var(--accent); }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div id="top"><span id="brand"></span><div id="bar"><i></i></div></div>
  <div id="scenes"></div>
  <div id="cap"></div>
</div>
<script>
const D = window.__DATA__;
const U = Math.min(D.width, D.height) / 1080;
document.documentElement.style.fontSize = 10 * U + 'px';
const stage = document.getElementById('stage');
stage.className = D.width > D.height ? 'h' : 'v';
document.getElementById('brand').textContent = D.brand || '';

const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const back = (x) => { x = clamp(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const mark = (s) => esc(s).replace(/\*(.+?)\*/g, '<em>$1</em>');
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

// Cada cena guarda uma lista de "atores": elemento + atraso de entrada (s) + efeito extra opcional.
const scenes = D.scenes.map((sc, idx) => {
  const root = el('div', 'scene');
  const dur = sc.end - sc.start;
  const actors = [];
  const add = (node, delay, extra) => { actors.push({ node, delay, extra }); return node; };
  if (sc.kicker) root.appendChild(add(el('div', 'kicker', esc(sc.kicker)), 0));
  if (sc.headline) root.appendChild(add(el('div', 'headline', mark(sc.headline)), 0.12));
  const v = sc.visual;
  if (v) {
    const items = v.items || [];
    const first = 0.7;
    const step = items.length ? Math.min(0.9, Math.max(0.15, (dur - first - 1.0) / items.length)) : 0;
    if (v.type === 'chips') {
      const box = root.appendChild(el('div', 'visual'));
      const strikeAt = Math.max(first + items.length * 0.14 + 0.3, dur * 0.5);
      items.forEach((txt, i) => {
        const chip = box.appendChild(el('div', 'chip', esc(txt) + (v.strike ? '<s></s>' : '')));
        const line = chip.querySelector('s');
        add(chip, v.strike ? first + i * 0.14 : first + i * step, line && ((local) => {
          const p = ease((local - strikeAt - i * 0.12) / 0.3);
          line.style.transform = `scaleX(${p})`;
          chip.style.color = p > 0.5 ? 'var(--dim)' : '';
        }));
      });
    } else if (v.type === 'steps' || v.type === 'checklist') {
      const box = root.appendChild(el('div', 'visual col'));
      items.forEach((txt, i) => {
        const ok = v.type === 'checklist';
        const row = box.appendChild(el('div', 'row', `<span class="badge${ok ? ' ok' : ''}">${ok ? '✓' : i + 1}</span><span>${mark(txt)}</span>`));
        const badge = row.querySelector('.badge');
        add(row, first + i * step, (local) => {
          badge.style.transform = `scale(${back((local - (first + i * step) - 0.2) / 0.4)})`;
        });
      });
    } else if (v.type === 'terminal') {
      const term = root.appendChild(el('div', 'term', '<div class="dots"><i></i><i></i><i></i></div><pre></pre>'));
      const pre = term.querySelector('pre');
      const lines = v.lines || [];
      const lstep = Math.max(0.5, (dur - first - 0.8) / Math.max(1, lines.length));
      add(term, 0.35, (local) => {
        let html = '';
        lines.forEach((ln, i) => {
          const n = Math.floor((local - (first + i * lstep)) * 34);
          if (n <= 0) return;
          html += (ln.startsWith('>') ? `<b>${esc(ln.slice(0, n))}</b>` : esc(ln.slice(0, n))) + '\n';
        });
        pre.innerHTML = html + (Math.floor(local * 2.5) % 2 ? '▍' : ' ');
      });
    }
  }
  document.getElementById('scenes').appendChild(root);
  return { ...sc, root, actors, last: idx === D.scenes.length - 1 };
});

const cap = document.getElementById('cap');
let capIdx = -2;

window.renderAt = (t) => {
  document.querySelector('#bar i').style.width = clamp(t / D.duration) * 100 + '%';
  for (const sc of scenes) {
    const local = t - sc.start;
    if (t < sc.start || t >= sc.end) { sc.root.style.opacity = 0; continue; }
    const out = sc.last ? 0 : ease((t - (sc.end - 0.22)) / 0.22);
    sc.root.style.opacity = 1 - out;
    sc.root.style.transform = `translateY(${-out * 3 * U * 10}px)`;
    for (const a of sc.actors) {
      const p = ease((local - a.delay) / 0.45);
      a.node.style.opacity = p;
      a.node.style.transform = `translateY(${(1 - p) * 5 * U * 10}px) scale(${0.94 + 0.06 * back((local - a.delay) / 0.5)})`;
      if (a.extra) a.extra(local);
    }
  }
  const i = D.captions.findIndex((c) => t >= c.start && t < c.end);
  if (i !== capIdx) {
    capIdx = i;
    cap.innerHTML = i < 0 ? '' : '<div>' + D.captions[i].words.map((w) => `<span>${esc(w.t)}</span>`).join(' ') + '</div>';
  }
  if (i >= 0) {
    const c = D.captions[i];
    const spans = cap.querySelectorAll('span');
    let now = -1;
    c.words.forEach((w, k) => { if (t >= w.s) now = k; });
    spans.forEach((s, k) => { s.className = k === now ? 'now' : k < now ? 'said' : ''; });
    cap.firstChild.style.transform = `scale(${0.9 + 0.1 * back((t - c.start) / 0.25)})`;
  }
};
window.renderAt(0);
</script>
</body>
</html>
